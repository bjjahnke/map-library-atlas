[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "map-library-atlas"
version = "0.1.0"
description = "Geospatial index of a local map collection"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "numpy>=1.26",
    "rasterio>=1.3",
    "pypdf>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
