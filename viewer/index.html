<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Map Library Atlas</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" />
    <style>
      html, body, #map { height: 100%; margin: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b1020; }

      #summary {
        position: absolute; top: 12px; left: 12px; z-index: 1;
        background: rgba(255, 255, 255, 0.92); color: #1c2333;
        padding: 8px 12px; border-radius: 6px; font-size: 13px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      }
      #summary strong { display: block; font-size: 14px; }

      .maplibregl-popup-content { padding: 0; border-radius: 8px; overflow: hidden; }
      .map-list-header {
        padding: 10px 34px 8px 12px; font-size: 13px; font-weight: 600;
        color: #1c2333; border-bottom: 1px solid #dde1ea;
      }
      .map-list { max-height: 260px; overflow-y: auto; margin: 0; padding: 0; list-style: none; }
      .map-list li { padding: 8px 12px; border-bottom: 1px solid #eef0f5; }
      .map-list li:last-child { border-bottom: none; }
      .map-title { font-size: 13px; color: #1c2333; }
      .map-path { font-size: 11px; color: #68718a; margin-top: 2px; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <div id="summary"><strong>Map Library Atlas</strong><span id="summary-text">Loading…</span></div>
    <div id="map"></div>
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <script src="app.js"></script>
  </body>
</html>
