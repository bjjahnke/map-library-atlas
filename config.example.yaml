# Copy to config.yaml (gitignored) and edit.

# Only used by `atlas census` (a read-only count of a folder). Optional.
maps_folder: /path/to/your/test-maps

# The atlas's own copy of every map, filled by `atlas add`. One flat folder.
library_dir: library

# Pipeline outputs (bronze/silver/gold live under here).
data_dir: data

# Manual inputs (PROJECT_SCOPE.md Section 5.5).
regions_csv: config/regions.csv
manifest_csv: config/map_manifest.csv

# false: every box comes from the manifest (your own box, or a region default).
# true: maps with location stored inside the file use that when you gave no box of your own.
use_embedded_location: false
